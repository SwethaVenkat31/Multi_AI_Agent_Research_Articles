<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Article | ResearchAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6fb;
            color: #202938;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Arial, sans-serif;
        }

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e8ebf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .brand {
            font-size: 20px;
            font-weight: 750;
            color: #202938;
        }

        .brand span {
            color: #635bff;
        }

        .nav-button {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475467;
            background: #f1f3f8;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 50px 22px 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .eyebrow {
            color: #635bff;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            font-size: 11px;
            font-weight: 750;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
            color: #182230;
        }

        .subtitle {
            color: #667085;
            margin-top: 10px;
            font-size: 15px;
        }

        .editor-card {
            background: #ffffff;
            border: 1px solid #e5e9f1;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(31, 41, 55, 0.05);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #dfe4ec;
            border-radius: 9px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 15px;
            color: #202938;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus,
        textarea:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.10);
        }

        input {
            margin-bottom: 25px;
        }

        textarea {
            min-height: 500px;
            resize: vertical;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            border: none;
            border-radius: 9px;
            padding: 12px 19px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel-button {
            background: #f1f3f8;
            color: #475467;
        }

        .save-button {
            background: #635bff;
            color: #ffffff;
        }

        .save-button:hover {
            background: #5148e8;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 0 20px;
            }

            .brand {
                font-size: 17px;
            }

            .container {
                padding: 35px 14px 50px;
            }

            .editor-card {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            textarea {
                min-height: 400px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">
            Research<span>AI</span>
        </div>

        <a href="{% url 'dashboard' %}" class="nav-button">
            Dashboard
        </a>
    </nav>

    <main class="container">

        <div class="page-heading">
            <div class="eyebrow">Article Editor</div>
            <h1>Edit Research Article</h1>
            <p class="subtitle">
                Update the article title or content and save your changes.
            </p>
        </div>

        <form method="POST" class="editor-card">
            {% csrf_token %}

            <label for="title">Article Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ article.title }}"
                required
            >

            <label for="content">Article Content</label>

            <textarea
                id="content"
                name="content"
                required
            >{{ article.content }}</textarea>

            <div class="actions">
                <a
                    href="{% url 'result' research_id=research.id %}"
                    class="button cancel-button">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="button save-button">
                    Save Changes
                </button>
            </div>
        </form>

    </main>

</body>
</html>
