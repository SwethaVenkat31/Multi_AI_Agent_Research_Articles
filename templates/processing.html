<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Article | ResearchAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fb;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Arial, sans-serif;
            color: #202938;
        }

        .processing-card {
            width: min(560px, calc(100% - 32px));
            background: white;
            border: 1px solid #e7eaf1;
            border-radius: 20px;
            padding: 42px 38px;
            box-shadow: 0 15px 45px rgba(31, 41, 55, 0.08);
            text-align: center;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #eeedff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #635bff;
            font-size: 32px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #dcd9ff;
            border-top-color: #635bff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -0.5px;
        }

        .topic {
            margin: 12px auto 28px;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
            max-width: 430px;
        }

        .progress-track {
            height: 7px;
            background: #edf0f5;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            width: 8%;
            background: #635bff;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .steps {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #98a2b3;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .step-icon {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #f0f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .step.active {
            color: #635bff;
            font-weight: 650;
        }

        .step.active .step-icon {
            background: #eeedff;
            color: #635bff;
        }

        .step.completed {
            color: #16a34a;
            font-weight: 600;
        }

        .step.completed .step-icon {
            background: #dcfce7;
            color: #16a34a;
        }

        .step.failed {
            color: #dc2626;
            font-weight: 600;
        }

        .step.failed .step-icon {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-message {
            margin-top: 28px;
            color: #667085;
            font-size: 13px;
        }

        .small-note {
            margin-top: 18px;
            color: #98a2b3;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .processing-card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="processing-card">

        <div class="icon-wrapper">
            <div class="spinner" id="spinner"></div>
        </div>

        <h1 id="main-title">Creating your research article</h1>

        <p class="topic">
            <strong>{{ research.topic }}</strong>
        </p>

        <div class="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="steps">

            <div class="step" id="step-research">
                <div class="step-icon">1</div>
                <span>Researching the topic</span>
            </div>

            <div class="step" id="step-planning">
                <div class="step-icon">2</div>
                <span>Planning the article structure</span>
            </div>

            <div class="step" id="step-writing">
                <div class="step-icon">3</div>
                <span>Writing the final article</span>
            </div>

            <div class="step" id="step-completed">
                <div class="step-icon">4</div>
                <span>Article ready</span>
            </div>

        </div>

        <div class="status-message" id="status-message">
            Research agent is analyzing your topic...
        </div>

        <div class="small-note">
            This may take a few moments while the AI agents work together.
        </div>

    </div>

    <script>
        const researchId = "{{ research.id }}";

        const statusUrl = `/research/${researchId}/status/`;
        const resultUrl = `/research/${researchId}/result/`;

        const stepResearch = document.getElementById("step-research");
        const stepPlanning = document.getElementById("step-planning");
        const stepWriting = document.getElementById("step-writing");
        const stepCompleted = document.getElementById("step-completed");

        const progressBar = document.getElementById("progress-bar");
        const statusMessage = document.getElementById("status-message");
        const mainTitle = document.getElementById("main-title");
        const spinner = document.getElementById("spinner");

        function resetSteps() {
            [
                stepResearch,
                stepPlanning,
                stepWriting,
                stepCompleted
            ].forEach(step => {
                step.classList.remove("active", "completed", "failed");
            });
        }

        function markCompleted(step) {
            step.classList.remove("active");
            step.classList.add("completed");
            step.querySelector(".step-icon").textContent = "✓";
        }

        function updateProgress(stage, status) {
            resetSteps();

            if (status === "failed" || stage === "failed") {
                mainTitle.textContent = "Article generation failed";
                statusMessage.textContent =
                    "Something went wrong while generating the article.";
                spinner.style.display = "none";
                progressBar.style.width = "100%";

                [
                    stepResearch,
                    stepPlanning,
                    stepWriting
                ].forEach(step => step.classList.add("failed"));

                return;
            }

            if (stage === "research") {
                stepResearch.classList.add("active");
                progressBar.style.width = "25%";
                statusMessage.textContent =
                    "Research agent is analyzing your topic...";
            }

            else if (stage === "planning") {
                markCompleted(stepResearch);
                stepPlanning.classList.add("active");
                progressBar.style.width = "50%";
                statusMessage.textContent =
                    "Planning agent is organizing the article structure...";
            }

            else if (stage === "writing") {
                markCompleted(stepResearch);
                markCompleted(stepPlanning);
                stepWriting.classList.add("active");
                progressBar.style.width = "75%";
                statusMessage.textContent =
                    "Writing agent is preparing the final article...";
            }

            else if (stage === "completed" && status === "completed") {
                markCompleted(stepResearch);
                markCompleted(stepPlanning);
                markCompleted(stepWriting);
                markCompleted(stepCompleted);

                progressBar.style.width = "100%";
                mainTitle.textContent = "Your article is ready!";
                statusMessage.textContent =
                    "Redirecting you to the completed article...";

                spinner.style.display = "none";

                setTimeout(() => {
                    window.location.href = resultUrl;
                }, 1000);
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch(statusUrl);
                const data = await response.json();

                updateProgress(data.current_stage, data.status);

                if (data.status !== "completed" && data.status !== "failed") {
                    setTimeout(checkStatus, 2000);
                }
            } catch (error) {
                statusMessage.textContent =
                    "Checking generation progress...";
                setTimeout(checkStatus, 3000);
            }
        }

        checkStatus();
    </script>

</body>
</html>
